name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Fix SPA routing (serve index.html for unknown routes)
        run: cp dist/green-office-farms/browser/index.html dist/green-office-farms/browser/404.html

      - name: Disable Jekyll processing
        run: touch dist/green-office-farms/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/green-office-farms/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

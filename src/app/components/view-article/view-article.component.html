<!-- Not found -->
<div class="not-found" *ngIf="notFound()">
  <p>Article not found.</p>
  <a routerLink="/articles">&larr; Back to Articles</a>
</div>

<ng-container *ngIf="article() as a">

  <!-- Header -->
  <section class="article-hero">
    <div class="container">
      <a class="back-link" routerLink="/articles">&larr; All Articles</a>
      <span class="category">{{ a.category }}</span>
      <h1>{{ a.title }}</h1>
      <div class="byline">
        <span>By {{ a.author }}</span>
        <span class="dot">&bull;</span>
        <span>{{ formatDate(a.published) }}</span>
        <span class="dot">&bull;</span>
        <span>{{ a.readingMinutes }} min read</span>
      </div>
    </div>
  </section>

  <!-- Body -->
  <section class="article-body">
    <div class="container">
      <div class="content">

        <ng-container *ngFor="let block of a.content">
          <p *ngIf="block.type === 'paragraph'">{{ block.text }}</p>
          <h2 *ngIf="block.type === 'heading'">{{ block.text }}</h2>
          <ul *ngIf="block.type === 'list'">
            <li *ngFor="let item of block.items">{{ item }}</li>
          </ul>
        </ng-container>

      </div>

      <div class="article-footer">
        <a class="back-btn" routerLink="/articles">&larr; Back to Articles</a>
      </div>
    </div>
  </section>

</ng-container>
